name: Tri-platform build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: ./build-app.command
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macos-agent-workbench
          path: build/CCHP Model Manager.app
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Test and build Windows installer
        run: |
          npm ci
          npm test
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          npm run tauri:build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-workbench-installer
          path: windows/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build Android APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-workbench-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
