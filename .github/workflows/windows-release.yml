name: Windows build and release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows x64 installer
        run: npm run tauri:build -- --bundles nsis
      - name: Prepare release assets
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $name = "Agent-Workbench-Windows-x64-$version-setup.exe"
          Copy-Item $installer[0].FullName "release-assets/$name"
          Copy-Item QUICKSTART.zh-CN.md release-assets/Windows-Quickstart.zh-CN.md
          Copy-Item ../LICENSE release-assets/LICENSE.txt
          $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding utf8NoBOM release-assets/SHA256SUMS.txt
          "WINDOWS_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-preview-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $notes = @"
          测试版（Pre-release），可下载安装，尚未确认为正式版。

          Windows x64 纯客户端。下载安装 ``Agent-Workbench-Windows-x64-$env:WINDOWS_VERSION-setup.exe``，无需 Docker、CCHP、本地模型、Rust 或 Visual Studio。系统缺少 WebView2 时，安装程序会联网补装。

          首次使用请看随附中文说明，或仓库 ``windows/QUICKSTART.zh-CN.md``。Claude Code / Codex CLI 需要单独安装，并填写自己的兼容网关地址与调用 Key；不附带作者的配置或密钥。

          包含模型选择与列表错误提示修复、独立终端、Token 用量和网关单价估算。金额估算不等于网关历史实扣。

          此版本未做商业代码签名。构建与自动测试运行于 GitHub Windows runner；用户界面和实际网关仍需自己的环境验证。

          对应源码提交：$env:GITHUB_SHA
          "@
          $notes | Set-Content -Encoding utf8NoBOM release-assets/RELEASE-NOTES.md
          gh release create $tag --draft --prerelease --target $env:GITHUB_SHA --title "Agent Workbench Windows 测试版 $env:WINDOWS_VERSION" --notes-file release-assets/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload $tag release-assets/*-setup.exe release-assets/Windows-Quickstart.zh-CN.md release-assets/LICENSE.txt release-assets/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit $tag --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
